appId: de.leongeorgi.RudolstadtForiOS
name: Festival selection keeps every tab usable
---
# Use normal app state; do not reset profiles, preferences, or cached data.
- launchApp
- tapOn: "More|Mehr"
- tapOn: "Settings|Einstellungen"
- tapOn:
    id: "festival-year-picker"
- tapOn: "Rudolstadt 2026"
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 20000
- tapOn: "More|Mehr"
- tapOn: "Settings|Einstellungen"
- tapOn:
    id: "festival-year-picker"
- tapOn: "Straßenmusikfestival Ludwigsburg 2026"
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 20000

# Tab labels remain in the accessibility tree even when a notice covers them.
# Check navigation to real content instead of merely asserting those labels.
- tapOn: "More|Mehr"
- assertVisible: "Settings|Einstellungen"
- tapOn: "Artists|Künstler"
- assertVisible:
    id: "artist-.*"
- tapOn: "Locations|Orte"
- assertVisible: "Approximate positions derived from the site plan.|Ungefähre Positionen aus dem Lageplan.*"
- tapOn: "Friends|Freunde"
- assertVisible: "Shared plans and iCloud sharing are unavailable.*|Gemeinsame Pläne und iCloud-Freigaben sind.*"
- tapOn: "Schedule|Zeitplan"
- assertVisible:
    id: "schedule-screen"

# Also exercise the archive banner and restore the current festival.
- tapOn: "More|Mehr"
- tapOn: "Settings|Einstellungen"
- tapOn:
    id: "festival-year-picker"
- tapOn: "Rudolstadt 2024"
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 20000
- tapOn: "More|Mehr"
- assertVisible: "Settings|Einstellungen"
- tapOn: "Settings|Einstellungen"
- tapOn:
    id: "festival-year-picker"
- tapOn: "Rudolstadt 2026"
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 20000
- tapOn: "More|Mehr"
- assertVisible: "Settings|Einstellungen"
