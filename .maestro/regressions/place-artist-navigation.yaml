appId: de.leongeorgi.RudolstadtForiOS
name: Map pins use sheets and artist links use classic place details
---
# Run with Rudolstadt 2026 selected. Preserve profiles and saved events.
- launchApp
- evalScript: ${output.restoreListMode = false}
- tapOn: "Locations|Orte"
- runFlow:
    when:
      visible:
        id: "stage-detail-.*"
    commands:
      - swipe:
          start: 50%,49%
          end: 50%,97%
          duration: 600
      - assertNotVisible:
          id: "stage-detail-.*"
- runFlow:
    when:
      notVisible:
        id: "festival-map"
    commands:
      - evalScript: ${output.restoreListMode = true}
      - tapOn:
          id: "locations-view-mode-toggle"
- tapOn:
    id: "festival-place-35"
- runFlow:
    when:
      notVisible:
        id: "stage-detail-35"
    commands:
      - tapOn:
          id: "festival-place-35"
- assertVisible:
    id: "stage-detail-35"
- assertNotVisible:
    id: "stage-map-preview"
- takeScreenshot: places-tab-sheet
- tapOn: 'Fri|Fr\.?'
- tapOn:
    id: "stage-event-45"
- assertVisible:
    id: "artist-detail-.*-theme-ready"
- assertNotVisible:
    id: "stage-detail-35"
- scrollUntilVisible:
    element:
      text: "Bauernhäuser"
    direction: DOWN
- tapOn: "Bauernhäuser"
- assertVisible:
    id: "stage-detail-35"
- assertVisible:
    id: "stage-map-preview"
- takeScreenshot: classic-place-detail
- scrollUntilVisible:
    element:
      text: 'Sat|Sa\.?'
    direction: DOWN
- tapOn: 'Sat|Sa\.?'
- scrollUntilVisible:
    element:
      id: "stage-event-.*"
    direction: DOWN
- tapOn:
    id: "stage-event-.*"
    index: 0
- assertVisible:
    id: "artist-detail-.*-theme-ready"
- assertNotVisible:
    id: "stage-detail-35"
- tapOn:
    id: "BackButton"
- assertVisible:
    id: "stage-detail-35"
- tapOn:
    id: "BackButton"
- assertVisible:
    id: "artist-detail-.*-theme-ready"
- assertNotVisible:
    id: "stage-detail-35"
- tapOn:
    id: "BackButton"
- assertVisible:
    id: "stage-detail-35"
- assertNotVisible:
    id: "stage-map-preview"
- swipe:
    start: 50%,49%
    end: 50%,97%
    duration: 600
- assertNotVisible:
    id: "stage-detail-35"
- assertVisible:
    id: "festival-map"
- runFlow:
    when:
      true: ${output.restoreListMode}
    commands:
      - tapOn:
          id: "locations-view-mode-toggle"
