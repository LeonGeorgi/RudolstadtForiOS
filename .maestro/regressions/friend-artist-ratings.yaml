appId: de.leongeorgi.RudolstadtForiOS
name: Friend badges open ratings with one or several friends
---
# Demo profiles are isolated from normal festival profiles; no CloudKit writes.
- launchApp:
    arguments:
      "-screenshotMode": "YES"
      "-screenshotAppearance": "light"
      "-AppleLanguages": "(de)"
      "-AppleLocale": "de_DE"
- extendedWaitUntil:
    visible:
      id: "schedule-screen"
    timeout: 20000
- tapOn:
    id: "theatermasks\\.fill"
- tapOn: "Darstellung|Layout"
- tapOn: "Liste|List"
- scrollUntilVisible:
    element:
      id: "artist-176"
    direction: DOWN
    timeout: 90000
    speed: 50
    visibilityPercentage: 10
    centerElement: true
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "artist-176"
- tapOn:
    id: "artist-friend-ratings"
- assertVisible:
    id: "artist-friend-ratings-overview"
- assertVisible: "Aya, 2 Herzen|Aya, 2 hearts"
- assertNotVisible: "Mika,.*"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: friend-ratings-single
- tapOn: "Close ratings|Bewertungen schließen"
- assertNotVisible:
    id: "artist-friend-ratings-overview"
- extendedWaitUntil:
    visible:
      id: "artist-friend-ratings"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "artist-friend-ratings"
- assertVisible:
    id: "artist-friend-ratings-overview"
- tapOn: "Close ratings|Bewertungen schließen"
- assertNotVisible:
    id: "artist-friend-ratings-overview"
- extendedWaitUntil:
    visible:
      id: "artist-friend-ratings"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "BackButton"
- scrollUntilVisible:
    element:
      id: "artist-223"
    direction: UP
    timeout: 90000
    speed: 50
    visibilityPercentage: 10
    centerElement: true
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "artist-223"
- tapOn:
    id: "artist-friend-ratings"
- assertVisible:
    id: "artist-friend-ratings-overview"
- assertVisible: "Aya, 2 Herzen|Aya, 2 hearts"
- assertVisible: "Mika, 3 Herzen|Mika, 3 hearts"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: friend-ratings-multiple
- tapOn: "Close ratings|Bewertungen schließen"
- assertNotVisible:
    id: "artist-friend-ratings-overview"
- extendedWaitUntil:
    visible:
      id: "artist-friend-ratings"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
