name: Android Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-screenshots.yml'
      - 'androidScreenshotTests/**'
      - 'scripts/android/**'
      - 'androidApp/**'
      - 'shared/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-screenshots.yml'
      - 'androidScreenshotTests/**'
      - 'scripts/android/**'
      - 'androidApp/**'
      - 'shared/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build screenshot APK once
        run: ./gradlew :androidApp:assembleDebug :androidScreenshotTests:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-apk
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug.apk
            androidScreenshotTests/build/outputs/apk/debug/androidScreenshotTests-debug.apk
          if-no-files-found: error
          retention-days: 1

  capture-screenshots:
    needs: build-app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7_pro
          - device: tablet
            profile: pixel_tablet
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: android-screenshot-apk
          path: ${{ runner.temp }}/apk
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture German and English in light and dark mode
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PREBUILT_APK_PATH: ${{ runner.temp }}/apk/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          NATIVE_TEST_APK_PATH: ${{ runner.temp }}/apk/androidScreenshotTests/build/outputs/apk/debug/androidScreenshotTests-debug.apk
          OUTPUT_ROOT: ${{ runner.temp }}/AndroidScreenshots
          DIAGNOSTICS_ROOT: ${{ runner.temp }}/AndroidScreenshotDiagnostics
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: rudolstadt-screenshots
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/capture-screenshots.sh
      - name: Upload screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ matrix.device }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/AndroidScreenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload capture diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-diagnostics-${{ matrix.device }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/AndroidScreenshotDiagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Add workflow summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
          DEVICE: ${{ matrix.device }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Android screenshots ($DEVICE)"
            echo
            echo "German and English, light and dark mode."
            echo "Result: $RESULT"
            echo "Screenshots: ${ARTIFACT_URL:-not uploaded}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-readme-screenshots:
    if: github.ref == 'refs/heads/master'
    needs: capture-screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-readme-screenshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download phone screenshots
        uses: actions/download-artifact@v5
        with:
          name: android-screenshots-phone-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/captures/phone
      - name: Download tablet screenshots
        uses: actions/download-artifact@v5
        with:
          name: android-screenshots-tablet-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/captures/tablet
      - name: Install preview dependency
        run: python -m pip install Pillow==12.3.0
      - name: Prepare complete gallery and optimized README previews
        env:
          CAPTURE_ROOT: ${{ runner.temp }}/captures
          PREPARED_ROOT: ${{ runner.temp }}/prepared
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python source/scripts/android/prepare_readme_screenshots.py \
            "$CAPTURE_ROOT" "$PREPARED_ROOT" \
            --repository "$REPOSITORY" --run-url "$RUN_URL" --commit "$SOURCE_COMMIT"
      - name: Publish stable screenshot links
        env:
          PREPARED_ROOT: ${{ runner.temp }}/prepared
          PUBLICATION_ROOT: ${{ runner.temp }}/screenshot-publication
        run: |
          bash source/scripts/android/publish-readme-screenshots.sh \
            "$PREPARED_ROOT" "$GITHUB_WORKSPACE/source" "$PUBLICATION_ROOT"
