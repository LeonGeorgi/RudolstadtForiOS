name: Data tooling checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install PDF rendering dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install pinned data-tool dependencies
        run: python -m pip install -r scripts/requirements-data.txt
      - name: Test offline data imports
        run: python -m unittest discover -s scripts/data -p '*_test.py'
      - name: Install pinned Ruby test dependency
        run: gem install minitest -v 5.25.5 --no-document
      - name: Test music-link rules without network requests
        run: ruby scripts/data/find_artist_music_links_test.rb
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q scripts
          sh -n scripts/ios/build-apple-framework.sh
          bash -n scripts/ios/capture-app-store-screenshots.sh
