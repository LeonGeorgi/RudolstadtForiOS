name: Update donation totals

on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:

concurrency:
  group: donation-totals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'LeonGeorgi/RudolstadtForiOS' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test aggregation and isolated publication
        run: python -m unittest discover -s scripts/donations -p '*_test.py'
      - name: Install Apple API signing dependency
        run: python -m pip install -r scripts/donations/requirements.txt
      - name: Calculate yearly totals by customer currency
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
        run: python scripts/donations/update_donations.py --output "$RUNNER_TEMP/donation-totals/donations.json"
      - name: Publish only the aggregate JSON
        run: bash scripts/donations/publish_donations.sh "$RUNNER_TEMP/donation-totals/donations.json" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/donation-publication"
