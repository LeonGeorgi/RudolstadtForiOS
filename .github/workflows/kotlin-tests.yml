name: Shared Kotlin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  common-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check formatting and test shared domain with bundled programs
        run: ./gradlew checkKotlinFormat :shared:jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-jvm-test-results
          path: shared/build/reports/tests/jvmTest
          if-no-files-found: warn

  android-library:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build Android app and verify bundled artist loading and shared resources
        run: ./gradlew :shared:verifyAndroidResources :androidApp:assembleDebug :androidApp:testDebugUnitTest :androidApp:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shared-android-library
          path: shared/build/outputs/aar/*.aar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  native-tests:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run the common suite on the host Kotlin Native runtime
        run: |
          case "$(uname -m)" in
            arm64) ./gradlew :shared:macosArm64Test ;;
            x86_64) ./gradlew :shared:macosX64Test ;;
            *) echo 'Unsupported native test host' >&2; exit 1 ;;
          esac
      - name: Compile the shared watchOS frameworks
        run: >-
          ./gradlew :shared:linkDebugFrameworkWatchosArm64
          :shared:linkDebugFrameworkWatchosDeviceArm64
          :shared:linkDebugFrameworkWatchosSimulatorArm64
          :shared:linkDebugFrameworkWatchosX64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-native-test-results
          path: shared/build/reports/tests/macos*Test
          if-no-files-found: warn
