  <text x="60" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" font-weight="600" fill="#2D2432" text-anchor="start">Jetzt liegt der Flächenschwerpunkt in der Mitte</text>
