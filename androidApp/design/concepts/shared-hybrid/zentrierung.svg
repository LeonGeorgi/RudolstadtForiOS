  <text x="60" y="1040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#786B7D" text-anchor="start">Geometrische Zentrierung, inklusive Aussparungen; Licht, Schatten und Hintergrund zählen nicht zur Motivfläche.</text>
