  <title id="title">Der Blechvogel — Festivalvogel Variante 3</title>
  <desc id="description">Ein cremefarbener Vogel mit geschlossenen Augen spielt ein übergroßes kupferorangefarbenes Blasinstrument. Eine breite Schallöffnung, geschwungene Rohrschleife und angehobener Fuß bilden die Silhouette auf Violett.</desc>
