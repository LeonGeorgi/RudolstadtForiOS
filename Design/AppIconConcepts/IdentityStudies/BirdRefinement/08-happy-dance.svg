  <title id="title">Festivalvogel – happy und tanzend</title>
  <desc id="description">Ein fröhlicher cremefarbener Vogel mit geschlossenem Lachauge und geöffnetem kupferfarbenem Schnabel spielt ein Akkordeon. Die Figur wiegt sich nach links, ein Fuß steht, der andere ist zum Tanz angehoben. Weiche Konturen und drei breite Balgfalten auf Violett.</desc>
